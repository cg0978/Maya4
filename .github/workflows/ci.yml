name: CI

on:
  pull_request:
  push:
    branches:
      - pypi

jobs:
  offline-qa:
    name: Offline QA (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: Install dependencies
        run: pdm install -G dev

      - name: Run linters
        run: |
          pdm run black --check maya4/__init__.py tests
          pdm run isort --check-only maya4/__init__.py tests
          pdm run flake8 --extend-ignore=E501 maya4/__init__.py tests

      - name: Run offline tests
        run: pdm run pytest -q -m "not network"

      - name: Build distributions
        run: |
          rm -rf build dist
          pdm build

      - name: Validate distributions
        run: |
          pdm run python -m twine check dist/*.tar.gz dist/*.whl
          pdm run python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          for path in sorted(Path("dist").glob("*")):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      members = archive.namelist()
              elif path.suffixes[-2:] == [".tar", ".gz"]:
                  with tarfile.open(path) as archive:
                      members = archive.getnames()
              else:
                  continue

              forbidden = [
                  name for name in members if "__pycache__" in name or name.endswith((".pyc", ".pyo"))
              ]
              if forbidden:
                  raise SystemExit(f"{path.name} contains forbidden files: {forbidden[:10]}")

              print(f"{path.name}: OK")
          PY

      - name: Wheel install smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/maya4-wheel-smoke
          /tmp/maya4-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/maya4-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/maya4-wheel-smoke/bin/python - <<'PY'
          import maya4

          print(maya4.__version__)
          PY
