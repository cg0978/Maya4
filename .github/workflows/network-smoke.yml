name: Network Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  live-bucket-smoke:
    name: Live Bucket Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      - name: Install dependencies
        run: pdm install -G dev

      - name: Run live Hugging Face bucket smoke test
        env:
          MAYA4_RUN_NETWORK_TESTS: "1"
        run: pdm run pytest -q tests/test_dataloader_fix.py
